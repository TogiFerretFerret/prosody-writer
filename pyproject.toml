[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosody-writer"
version = "0.1.0"
description = "An incremental poetry editor powered by full Prosodic"
requires-python = ">=3.10"
dependencies = ["prosodic==3.10.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["prosody_writer*"]

[tool.setuptools.package-data]
prosody_writer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
